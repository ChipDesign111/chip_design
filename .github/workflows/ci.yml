name: INT8 RTL
on:
  push:
    branches: [main, xzx]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python tools/project.py check
      - run: python test/int8/run.py --count 32 --trained
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int8-functional-evidence
          path: test/int8/runs/**
          retention-days: 14
