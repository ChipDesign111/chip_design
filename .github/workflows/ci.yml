name: INT8 RTL
on:
  push:
    branches: [main, xzx]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: compiler/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r compiler/requirements.txt
      - run: python test/int8/test_raw_compiler.py
  rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python tools/project.py check
      - run: python test/int8/run.py --count 32 --trained
      - run: python test/int8/run_raw_gemv.py
      - run: python test/int8/run_generic_soc.py --reference-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int8-functional-evidence
          path: test/int8/runs/**
          retention-days: 14
