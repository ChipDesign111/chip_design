# For the external FT232H MPSSE adapter, NOT the onboard Xilinx config TAP.
# AD0 -> E15/TCK, AD1 -> E16/TDI, AD2 <- D15/TDO, AD3 -> C15/TMS.
# GND -> J5 33/34; VREF -> J5 35/36 (+3.3V), in addition to four signals.
# Use the adapter's end-face 2x5 connector and actual course harness labels.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -ndata 0x0010
transport select jtag
adapter speed 1000
reset_config none
bindto 127.0.0.1
tcl_port 6666
telnet_port 4444
gdb_port 3333
# dmi_jtag's IdcodeValue default in this RTL is 0x00000001; IR length is 5.
jtag newtap cv32 cpu -irlen 5 -expected-id 0x00000001
target create cv32.cpu riscv -chain-position cv32.cpu
init
riscv set_mem_access sysbus
